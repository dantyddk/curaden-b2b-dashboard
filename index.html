<script>

const S={view:'readme',page:1,boot:null,charts:{},data:null};const $=x=>document.getElementById(x),fmt={money:v=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0),num:v=>new Intl.NumberFormat('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0),pct:v=>new Intl.NumberFormat('en-GB',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2}).format(v||0)};
const titles={readme:['Read Me','Metric definitions, calculation rules and current data limitations.'],market:['Market Performance','B2B webshop performance across Curaprox markets.'],promo:['Discount Performance','Promotion performance, efficiency and distribution over time.'],segment:['Segment Performance','Commercial performance and ERP share across customer segments.'],user:['User Performance','Purchasing performance at user-email level.'],behavior:['User Behavior','Purchase frequency, drop-off and recovery behavior.']};
const abs={gmvInc:'GMV incl. tax',gmvExc:'GMV excl. tax',actualPaid:'Actual paid',cm1:'CM1',orders:'Orders',customers:'Purchasing users',qty:'Quantity',shipping:'Shipping fee',discount:'Discount amount',tax:'Tax',paygate:'Paygate fee',promoOrders:'Promo orders',aov:'Average order value',qtyPerOrder:'Items per order'};
const rates={promoOrderRate:'Promo order rate',shippingRate:'Shipping / GMV',taxRate:'Tax / GMV incl. tax',discountRate:'Discount / GMV',paygateRate:'Paygate / GMV',cm1Rate:'CM1 margin',erpGmvShare:'ERP GMV share',erpOrderShare:'ERP order share',erpCustomerShare:'ERP customer share'};
const promoAbs={gmvInc:'GMV incl. tax',gmvExc:'GMV excl. tax',discount:'Discount amount',orders:'Promo orders',customers:'Promo users',aov:'Average order value',discountPerOrder:'Discount per order'};const promoRates={discountRate:'Discount / GMV',gmvPerDiscount:'GMV per € discount'};
function api(action,p={}){if(APPS_SCRIPT_URL.startsWith('YOUR_'))return Promise.resolve(mock(action));return new Promise((ok,no)=>{const cb='cb'+Date.now()+Math.random().toString(36).slice(2),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();r.ok?ok(r.data):no(Error(r.error))};s.onerror=()=>no(Error('Unable to reach Apps Script'));s.src=APPS_SCRIPT_URL+'?'+new URLSearchParams({action,...p,callback:cb});document.body.appendChild(s)})}
function params(){return{market:$('market').value,from:$('from').value,to:$('to').value,grain:$('grain').value,q:$('search').value,page:S.page,size:25}}
function destroy(id){if(S.charts[id]){S.charts[id].destroy();delete S.charts[id]}}function soften(c){const m={'#153c74':'#0647ad','#2bc4d9':'#00a9d6','#ff4f8b':'#e91e73','#ffd34e':'#f1b928','#70d7bd':'#82cf00','rgba(255,79,139,.12)':'rgba(233,30,115,.09)','rgba(43,196,217,.12)':'rgba(0,169,214,.09)'};return m[c]||c}function chart(id,type,labels,datasets,opt={}){destroy(id);datasets=datasets.map(d=>({...d,borderColor:Array.isArray(d.borderColor)?d.borderColor.map(soften):soften(d.borderColor),backgroundColor:Array.isArray(d.backgroundColor)?d.backgroundColor.map(soften):soften(d.backgroundColor)}));if(type==='doughnut'&&datasets[0]){const total=datasets[0].data.reduce((a,b)=>a+(Number(b)||0),0);labels=labels.map((l,i)=>`${l} · ${total?((Number(datasets[0].data[i])||0)/total*100).toFixed(2):'0.00'}%`)}S.charts[id]=new Chart($(id),{type,data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:10,usePointStyle:true,color:'#445469'}},tooltip:{callbacks:{label:c=>`${c.label}: ${Number(c.raw||0).toFixed(2)}`}}},scales:type==='doughnut'?{}:{y:{beginAtZero:true,grid:{color:'#e7ebf0'},ticks:{color:'#707987'}},x:{grid:{display:false},ticks:{color:'#707987'}}},...opt}})}
function sel(id,items,val){return `<div class="selector"><label>Metric</label><select id="${id}">${Object.entries(items).map(([k,v])=>`<option value="${k}" ${k===val?'selected':''}>${v}</option>`).join('')}</select></div>`}function card(title,body,control=''){return `<div class="card"><div class="cardhead"><h2>${title}</h2>${control}</div>${body}</div>`}function canvas(id,small=false){return `<div class="chart ${small?'small':''}"><canvas id="${id}"></canvas></div>`}
function metrics(s){const items=[['GMV incl. tax',fmt.money(s.gmvInc)],['GMV excl. tax',fmt.money(s.gmvExc)],['Net incl. tax',fmt.money(s.netInc)],['CM1',fmt.money(s.cm1)],['Orders',fmt.num(s.orders)],['Purchasing users',fmt.num(s.customers)],['Discount amount',fmt.money(s.discount)],['Average order value',fmt.money(s.aov)],['Average items / order',fmt.num(s.qtyPerOrder)],['Average orders / purchasing user',fmt.num(s.ordersPerCustomer)],['% Promo burn',fmt.pct(s.promoBurnRate)],['% Average promo discount',fmt.pct(s.discountRate)],['% Promo order',fmt.pct(s.promoOrderRate)],['% Paygate fee',fmt.pct(s.paygateRate)],['% CM1',fmt.pct(s.cm1Rate)]];return '<h2 class="section-title">Performance metrics</h2><div class="metrics">'+items.map(x=>`<div class="metric"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')+'</div>'}
function erpMetrics(s){return '<h2 class="section-title">ERP share</h2><div class="metrics erp-metrics">'+[['ERP GMV share',fmt.pct(s.erpGmvShare)],['ERP order share',fmt.pct(s.erpOrderShare)],['ERP purchasing-user share',fmt.pct(s.erpCustomerShare)]].map(x=>`<div class="metric"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')+'</div>'}
function tbl(cols,rows){if(!rows.length)return'<div class="empty">No data for the selected filters.</div>';return`<div class="tablewrap"><table><thead><tr>${cols.map((x,i)=>`<th ${x[3]===true||!x[2]?`class="sortable" data-col="${i}" aria-sort="none" title="Sort ascending / descending"`:''}>${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(x=>`<td class="${x[2]?'n':''}" data-sort="${String(x[4]?x[4](r):x[1](r)).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${x[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function value(metric,v,percent=false){if(percent||metric.includes('Rate')||metric.includes('Share'))return fmt.pct(v);if(['orders','customers','qty','promoOrders'].includes(metric))return fmt.num(v);return fmt.money(v)}
async function load(){Object.values(S.charts).forEach(c=>c.destroy());S.charts={};if(S.view==='readme'){renderReadme();$('status').textContent='Definitions';return}$('main').classList.add('loading');$('content').innerHTML='<div class="card empty">Loading dashboard…</div>';try{S.data=await api(S.view,params());render();$('status').textContent=APPS_SCRIPT_URL.startsWith('YOUR_')?'Preview data':'Live sheet'}catch(e){$('content').innerHTML=`<div class="notice error">${e.message}</div>`;$('status').textContent='Connection error'}finally{$('main').classList.remove('loading')}}
function render(){if(S.view==='behavior'&&!S.data.frequency){const r=S.data.rows||[],rep=r.filter(x=>x.orders>1),defs=[['≤ 60 days',0,60],['61–120 days',61,120],['121–180 days',121,180],['181–240 days',181,240],['241–300 days',241,300],['301–365 days',301,365],['> 365 days',366,999999]];S.data.frequency=defs.map(x=>{const users=rep.filter(y=>(Number(y.avgDays)||0)>=x[1]&&(Number(y.avgDays)||0)<=x[2]).length;return{bucket:x[0],users,share:rep.length?users/rep.length:0}});S.data.recoveryThreshold=180;const rec=rep.filter(x=>(Number(x.maxDays)||0)>=180),s=S.data.summary;s.repeatUsers=rep.length;s.avgOrdersPerUser=r.length?r.reduce((a,x)=>a+(Number(x.orders)||0),0)/r.length:0;s.avgMinGapDays=rep.length?rep.reduce((a,x)=>a+(Number(x.minDays)||0),0)/rep.length:0;s.avgMaxGapDays=rep.length?rep.reduce((a,x)=>a+(Number(x.maxDays)||0),0)/rep.length:0;s.recoveredUsers=rec.length;s.recoveryRate=rep.length?rec.length/rep.length:0;s.avgRecoveryGapDays=rec.length?rec.reduce((a,x)=>a+(Number(x.maxDays)||0),0)/rec.length:0}({readme:renderReadme,market:renderMarket,promo:renderPromo,segment:renderSegment,user:renderUser,behavior:renderBehavior}[S.view])()}
function renderReadme(){const defs=[['GMV_incTax','Merchandise value including tax and shipping. Formula: Σ(Line-item quantity × Line-item price) + Shipping.'],['GMV_excTax','GMV after removing tax. Formula: GMV_incTax − Taxes.'],['Net_incTax','Customer payment remaining after payment-gateway cost. Formula: Actual Customer Paid − Paygate fee incl. tax.'],['Orders & purchasing users','Orders count eligible order IDs. Purchasing users count unique customer emails per day.'],['Average order value','Average GMV generated by each eligible order. Formula: GMV_incTax ÷ Orders.'],['% Promo burn','Discount cost relative to GMV excluding tax. Formula: Discount amount ÷ GMV_excTax.'],['% Promo order','Promo orders ÷ Total orders. A promo order has a discount amount, discount code or mapped promo type other than “No Discount”.'],['% Average promo discount','Weighted discount rate across promotional orders. Formula: Σ Discount ÷ Σ(GMV_incTax + Discount).'],['% Paygate fee','Payment-gateway cost as a share of value collected after discount. Formula: Σ Paygate fee incl. tax ÷ Σ(GMV_incTax + Discount).'],['Promotion type distribution','Order share, total discount cost, average cost per order and weighted discount rate calculated within promotional orders only.'],['Currency conversion','Source values are consolidated in EUR. Formula: EUR = Local amount × Currency rate to EUR.'],['CM1','Provisional CM1 = GMV_excTax − Discount − Paygate fee. Product, fulfilment, shipping, platform, agency and other operating costs are not yet included.'],['ERP shares','ERP-tagged GMV, orders or purchasing users ÷ the corresponding webshop total.']];$('content').innerHTML=`<div class="readme"><div class="card"><h3>Metric definitions</h3>${defs.map(x=>`<div class="definition"><b>${x[0]}</b><div>${x[1]}</div></div>`).join('')}</div><div class="card"><h3>Dashboard behavior</h3><p>The dashboard opens with the latest three calendar months. Changing a filter does not reload data until Apply is selected. Dimension columns can be sorted by clicking their headers.</p></div><div class="notice">ERP share measures the ERP-tagged share inside webshop data. It is not the webshop share of the country’s total B2B business.</div></div>`}
function renderMarket(){const d=S.data;$('content').innerHTML=metrics(d.summary)+erpMetrics(d.summary)+`<div class="grid2">${card('Performance over time',canvas('absTrend'),sel('absTrendSel',abs,'gmvExc'))}${card('Rate over time',canvas('pctTrend'),sel('pctTrendSel',rates,'promoOrderRate'))}</div><div class="grid3">${card('Market comparison',canvas('marketBar'),sel('marketSel',abs,'gmvExc'))}${card('Market contribution',canvas('marketPie',true),sel('pieSel',abs,'gmvExc'))}</div>`+card('Market comparison by selected period',tbl([['Period',x=>x.period,0,true],['Market',x=>x.market,0,true],['GMV incl.',x=>fmt.money(x.gmvInc),1],['GMV excl.',x=>fmt.money(x.gmvExc),1],['Orders',x=>fmt.num(x.orders),1],['Users',x=>fmt.num(x.customers),1],['AOV',x=>fmt.money(x.aov),1],['CM1',x=>fmt.money(x.cm1),1],['Promo %',x=>fmt.pct(x.promoOrderRate),1],['ERP GMV %',x=>fmt.pct(x.erpGmvShare),1],['ERP order %',x=>fmt.pct(x.erpOrderShare),1],['ERP user %',x=>fmt.pct(x.erpCustomerShare),1]],d.detail));const draw=()=>{const a=$('absTrendSel').value,r=$('pctTrendSel').value,m=$('marketSel').value,p=$('pieSel').value;chart('absTrend','line',d.trend.map(x=>x.period),[{label:abs[a],data:d.trend.map(x=>x[a]),borderColor:'#ff4f8b',backgroundColor:'rgba(255,79,139,.12)',fill:true,tension:.25}]);chart('pctTrend','line',d.trend.map(x=>x.period),[{label:rates[r],data:d.trend.map(x=>x[r]*100),borderColor:'#2bc4d9',backgroundColor:'rgba(43,196,217,.12)',fill:true,tension:.25}]);chart('marketBar','bar',d.markets.map(x=>x.name),[{label:abs[m],data:d.markets.map(x=>x[m]),backgroundColor:'#153c74'}],{indexAxis:'y'});chart('marketPie','doughnut',d.markets.map(x=>x.name),[{data:d.markets.map(x=>x[p]),backgroundColor:palette(d.markets.length)}])};['absTrendSel','pctTrendSel','marketSel','pieSel'].forEach(i=>$(i).onchange=draw);draw()}
function renderPromo(){const d=S.data,s=d.summary,efficient=d.types.filter(x=>x.discount>0).sort((a,b)=>b.gmvPerDiscount-a.gmvPerDiscount)[0],top=d.types[0],aov=[...d.types].sort((a,b)=>b.aov-a.aov)[0];$('content').innerHTML='<div class="metrics">'+[['Promo GMV incl.',fmt.money(s.gmvInc)],['Promo GMV excl.',fmt.money(s.gmvExc)],['Promo orders',fmt.num(s.orders)],['Promo users',fmt.num(s.customers)],['Discount amount',fmt.money(s.discount)],['Discount / GMV',fmt.pct(s.discountRate)],['Discount / order',fmt.money(s.discountPerOrder)],['GMV / € discount',fmt.num(s.gmvPerDiscount)]].map(x=>`<div class="metric"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')+'</div>'+`<div class="callouts"><div class="callout"><span>Highest GMV promo type</span><b>${top?top.name:'-'}</b></div><div class="callout"><span>Highest average order value</span><b>${aov?aov.name:'-'}</b></div><div class="callout"><span>Best GMV per € discount</span><b>${efficient?efficient.name:'-'}</b></div></div><div class="grid2">${card('Promo type performance over time',canvas('promoAbs'),sel('promoAbsSel',promoAbs,'gmvExc'))}${card('Promo efficiency over time',canvas('promoPct'),sel('promoPctSel',promoRates,'discountRate'))}</div><div class="grid3">${card('Promo type comparison',canvas('promoBar'),sel('promoBarSel',promoAbs,'gmvExc'))}${card('Promo distribution',canvas('promoPie',true),sel('promoPieSel',promoAbs,'orders'))}</div>`+card('Promo code performance by selected period',tbl([['Period',x=>x.period],['Promo code',x=>x.code],['Description',x=>x.description],['Type',x=>x.type],['Objective',x=>x.objective],['Environment',x=>x.environment],['Channel',x=>x.channel],['GMV excl.',x=>fmt.money(x.gmvExc),1],['Orders',x=>fmt.num(x.orders),1],['AOV',x=>fmt.money(x.aov),1],['Discount',x=>fmt.money(x.discount),1],['Discount / GMV',x=>fmt.pct(x.discountRate),1]],d.codes));const draw=()=>{drawMulti('promoAbs',d.trend,$('promoAbsSel').value,promoAbs,false);drawMulti('promoPct',d.trend,$('promoPctSel').value,promoRates,true);const b=$('promoBarSel').value,p=$('promoPieSel').value;chart('promoBar','bar',d.types.map(x=>x.name),[{label:promoAbs[b],data:d.types.map(x=>x[b]),backgroundColor:'#2bc4d9'}]);chart('promoPie','doughnut',d.types.map(x=>x.name),[{data:d.types.map(x=>x[p]),backgroundColor:palette(d.types.length)}])};['promoAbsSel','promoPctSel','promoBarSel','promoPieSel'].forEach(i=>$(i).onchange=draw);draw()}
function drawMulti(id,rows,metric,labels,percent){const periods=[...new Set(rows.map(x=>x.period))],types=[...new Set(rows.map(x=>x.type))];chart(id,'line',periods,types.map((t,i)=>({label:t,data:periods.map(p=>{const x=rows.find(r=>r.period===p&&r.type===t);return x?(percent&&metric!=='gmvPerDiscount'?x[metric]*100:x[metric]):0}),borderColor:palette(types.length)[i],backgroundColor:'transparent',tension:.2}))) }
function renderSegment(){const d=S.data;$('content').innerHTML=metrics(d.summary)+erpMetrics(d.summary)+`<div class="grid3">${card('Segment comparison',canvas('segAbs'),sel('segAbsSel',abs,'gmvExc'))}${card('Segment contribution',canvas('segPie',true),sel('segPieSel',abs,'gmvExc'))}</div><div class="grid2">${card('Segment rates',canvas('segPct'),sel('segPctSel',rates,'promoOrderRate'))}${card('Segment performance over time',canvas('segTrend'),sel('segTrendSel',abs,'gmvExc'))}</div>`+card('Segment comparison by month',tbl([['Period',x=>x.period,0,true],['Segment',x=>x.type,0,true],['GMV incl.',x=>fmt.money(x.gmvInc),1],['GMV excl.',x=>fmt.money(x.gmvExc),1],['Orders',x=>fmt.num(x.orders),1],['Users',x=>fmt.num(x.customers),1],['AOV',x=>fmt.money(x.aov),1],['CM1',x=>fmt.money(x.cm1),1],['CM1 %',x=>fmt.pct(x.cm1Rate),1],['Promo %',x=>fmt.pct(x.promoOrderRate),1],['ERP GMV %',x=>fmt.pct(x.erpGmvShare),1],['ERP order %',x=>fmt.pct(x.erpOrderShare),1]],d.detail||d.trend));const draw=()=>{const a=$('segAbsSel').value,p=$('segPieSel').value,r=$('segPctSel').value;chart('segAbs','bar',d.segments.map(x=>x.name),[{label:abs[a],data:d.segments.map(x=>x[a]),backgroundColor:'#153c74'}]);chart('segPie','doughnut',d.segments.map(x=>x.name),[{data:d.segments.map(x=>x[p]),backgroundColor:palette(d.segments.length)}]);chart('segPct','bar',d.segments.map(x=>x.name),[{label:rates[r],data:d.segments.map(x=>x[r]*100),backgroundColor:'#ff4f8b'}]);drawMulti('segTrend',d.trend,$('segTrendSel').value,abs,false)};['segAbsSel','segPieSel','segPctSel','segTrendSel'].forEach(i=>$(i).onchange=draw);draw()}
function renderUser(){const d=S.data;$('content').innerHTML=card('User-level performance',tbl([['Market',x=>x.market],['User email',x=>x.email],['GMV incl.',x=>fmt.money(x.gmvInc),1],['GMV excl.',x=>fmt.money(x.gmvExc),1],['Orders',x=>fmt.num(x.orders),1],['AOV',x=>fmt.money(x.aov),1],['Items / order',x=>fmt.num(x.qtyPerOrder),1],['Promo order %',x=>fmt.pct(x.promoOrderRate),1],['Discount / GMV',x=>fmt.pct(x.discountRate),1]],d.rows)+pager(d))}
function renderBehavior(){const d=S.data,s=d.summary;$('content').innerHTML='<div class="metrics">'+[['Purchasing users',fmt.num(s.users)],['Users with 2+ orders',fmt.num(s.repeatUsers)],['Average orders / user',fmt.num(s.avgOrdersPerUser)],['Average frequency',fmt.num(s.avgFrequencyDays)+' days'],['Average minimum gap',fmt.num(s.avgMinGapDays)+' days'],['Average maximum gap',fmt.num(s.avgMaxGapDays)+' days'],['Recovered users',fmt.num(s.recoveredUsers)],['Recovery rate',fmt.pct(s.recoveryRate)],['Average recovery gap',fmt.num(s.avgRecoveryGapDays)+' days']].map(x=>`<div class="metric"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')+'</div>'+`<div class="notice">Recovery is identified when the maximum interval between two consecutive orders is at least ${d.recoveryThreshold} days and the user later places another order.</div><div class="grid2">${card('Purchase frequency distribution',canvas('frequency',true))}${card('Purchase progression and drop-off',canvas('drop',true))}</div><div class="grid2">${card('Frequency detail',tbl([['Average interval',x=>x.bucket],['Users',x=>fmt.num(x.users),1],['Distribution',x=>fmt.pct(x.share),1]],d.frequency))}${card('Progression detail',tbl([['Stage',x=>'Reached order '+x.step],['Users reached',x=>fmt.num(x.reached),1],['Reached next order',x=>fmt.num(x.next),1],['Retention to next',x=>fmt.pct(x.retention),1],['Drop-off after stage',x=>fmt.pct(x.dropoff),1]],d.stages))}</div>`+card('User purchase behavior',tbl([['Market',x=>x.market],['User email',x=>x.email],['First order',x=>x.firstOrder],['Last order',x=>x.lastOrder],['Orders',x=>fmt.num(x.orders),1],['Average gap',x=>fmt.num(x.avgDays)+' days',1],['Minimum gap',x=>fmt.num(x.minDays)+' days',1],['Maximum gap',x=>fmt.num(x.maxDays)+' days',1],['Items / order',x=>fmt.num(x.qtyPerOrder),1],['GMV / order',x=>fmt.money(x.gmvPerOrder),1],['Promo order',x=>fmt.pct(x.promoRate),1]],d.rows)+pager(d));chart('frequency','doughnut',d.frequency.map(x=>x.bucket),[{data:d.frequency.map(x=>x.users),backgroundColor:palette(d.frequency.length)}]);chart('drop','bar',d.stages.map(x=>'After order '+x.step),[{label:'Drop-off %',data:d.stages.map(x=>x.dropoff*100),backgroundColor:'#ff4f8b'},{label:'Continue %',data:d.stages.map(x=>x.retention*100),backgroundColor:'#2bc4d9'}])}
function pager(d){const p=Math.max(1,Math.ceil(d.total/d.size));return`<div class="pager"><span>${fmt.num(d.total)} users · Page ${d.page}/${p}</span><button onclick="go(${Math.max(1,d.page-1)})">Previous</button><button onclick="go(${Math.min(p,d.page+1)})">Next</button></div>`}function go(p){S.page=p;load()}
function palette(n){const a=['#0647ad','#00a9d6','#e91e73','#82cf00','#75358a','#f1b928','#006d77','#ff7b54','#5c6bc0','#2f7d5b'];return Array.from({length:n},(_,i)=>a[i%a.length])}
function view(v){S.view=v;S.page=1;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('title').textContent=titles[v][0];$('subtitle').textContent=titles[v][1];$('filters').classList.toggle('hidden',v==='readme');$('grainField').classList.toggle('hidden',!['market','promo'].includes(v));$('searchField').classList.toggle('hidden',!['user','behavior'].includes(v));$('gap').classList.toggle('hidden',!['market'].includes(v));load()}function reset(){if(S.boot){$('market').value='All';$('from').value=S.boot.defaultFrom||S.boot.minDate;$('to').value=S.boot.maxDate}$('grain').value='month';$('search').value='';S.page=1;load()}
document.querySelectorAll('.nav button').forEach(b=>{b.textContent=titles[b.dataset.view][0];b.onclick=()=>view(b.dataset.view)});$('apply').onclick=()=>{S.page=1;load()};$('reset').onclick=reset;$('search').onkeydown=e=>{if(e.key==='Enter'){S.page=1;load()}};
document.addEventListener('click',e=>{const th=e.target.closest('th.sortable');if(!th)return;const table=th.closest('table'),body=table.tBodies[0],col=Number(th.dataset.col),asc=th.getAttribute('aria-sort')!=='ascending';table.querySelectorAll('th.sortable').forEach(x=>x.setAttribute('aria-sort','none'));th.setAttribute('aria-sort',asc?'ascending':'descending');[...body.rows].sort((a,b)=>{const av=a.cells[col].dataset.sort||'',bv=b.cells[col].dataset.sort||'';return(asc?1:-1)*av.localeCompare(bv,undefined,{numeric:true,sensitivity:'base'})}).forEach(r=>body.appendChild(r))});

api('bootstrap').then(b=>{S.boot=b;b.markets.forEach(m=>$('market').add(new Option(m,m)));$('from').value=b.defaultFrom||b.minDate;$('to').value=b.maxDate;load()});
