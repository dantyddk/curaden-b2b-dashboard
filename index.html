<!doctype html>
<!-- Dashboard version: Embedded turnover metrics v5, 22 Oct 2026 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Curaprox B2B Performance</title>
    <meta
      name="description"
      content="Curaprox B2B webshop performance dashboard"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23153c74'/%3E%3Ccircle cx='23' cy='25' r='9' fill='%232bc4d9'/%3E%3Ccircle cx='41' cy='39' r='11' fill='%23ff4f8b'/%3E%3C/svg%3E"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --blue: #153c74;
        --cyan: #2bc4d9;
        --pink: #ff4f8b;
        --yellow: #ffd34e;
        --mint: #70d7bd;
        --ink: #17243b;
        --muted: #68758a;
        --bg: #f5f7fb;
        --card: #fff;
        --line: #dde5ef;
        --shadow: 0 10px 28px rgba(21, 60, 116, 0.09);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        color: var(--ink);
        background: var(--bg);
        font-size: 16px;
      }
      .app {
        display: grid;
        grid-template-columns: 255px 1fr;
        min-height: 100vh;
      }
      .side {
        background: var(--blue);
        color: #fff;
        padding: 25px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      .brand {
        font-size: 1.45rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        padding: 4px 11px 22px;
      }
      .brand span {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        color: var(--cyan);
        margin-top: 7px;
      }
      .nav {
        display: grid;
        gap: 7px;
      }
      .nav button {
        border: 0;
        background: transparent;
        color: #d9e6f7;
        text-align: left;
        padding: 12px 14px;
        border-radius: 10px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 750;
        cursor: pointer;
      }
      .nav button:hover,
      .nav button.active {
        background: #fff;
        color: var(--blue);
      }
      .dotbar {
        display: flex;
        gap: 5px;
        padding: 24px 12px;
      }
      .dotbar i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .main {
        padding: 27px 30px 50px;
        min-width: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        align-items: flex-start;
        margin-bottom: 20px;
      }
      .top h1 {
        margin: 0;
        color: var(--blue);
        font-size: 1.75rem;
      }
      .top p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .badge {
        background: #e8fbff;
        color: #087c94;
        border: 1px solid #b7ecf4;
        border-radius: 999px;
        padding: 7px 11px;
        font-size: 0.76rem;
        font-weight: 800;
        white-space: nowrap;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 10px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        margin-bottom: 16px;
      }
      .field {
        display: grid;
        gap: 5px;
      }
      .field label,
      .selector label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-weight: 800;
        color: var(--muted);
      }
      select,
      input {
        height: 39px;
        border: 1px solid #cad6e5;
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 0 10px;
        font: inherit;
        font-size: 0.85rem;
      }
      .btn {
        height: 39px;
        border: 0;
        border-radius: 8px;
        padding: 0 16px;
        background: var(--pink);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      .btn.secondary {
        background: #eaf0f8;
        color: var(--blue);
      }
      .notice {
        border: 1px solid #f4d779;
        background: #fff9df;
        color: #745812;
        border-radius: 10px;
        padding: 10px 13px;
        margin-bottom: 16px;
        font-size: 0.82rem;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(6, minmax(135px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }
      .metric {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 14px;
        box-shadow: 0 4px 15px rgba(21, 60, 116, 0.05);
        border-top: 4px solid var(--cyan);
      }
      .metric:nth-child(4n + 2) {
        border-top-color: var(--pink);
      }
      .metric:nth-child(4n + 3) {
        border-top-color: var(--yellow);
      }
      .metric:nth-child(4n + 4) {
        border-top-color: var(--mint);
      }
      .metric .l {
        font-size: 0.7rem;
        color: var(--muted);
        font-weight: 750;
        min-height: 28px;
      }
      .metric .v {
        font-size: 1.2rem;
        color: var(--blue);
        font-weight: 900;
        margin-top: 4px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 15px;
        margin-bottom: 15px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .cardhead {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      .card h2 {
        font-size: 0.96rem;
        margin: 0;
        color: var(--blue);
      }
      .selector {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .selector select {
        height: 34px;
      }
      .chart {
        height: 315px;
      }
      .chart.small {
        height: 265px;
      }
      .tablewrap {
        overflow: auto;
        max-height: 560px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.79rem;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #edf4fb;
        color: #38516f;
        text-align: left;
        padding: 10px;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        z-index: 2;
      }
      td {
        padding: 9px 10px;
        border-top: 1px solid #edf1f6;
      }
      td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      tbody tr:hover {
        background: #f8fbff;
      }
      .callouts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 15px;
      }
      .callout {
        padding: 16px;
        border-radius: 13px;
        color: #fff;
        background: var(--blue);
      }
      .callout:nth-child(2) {
        background: #087f97;
      }
      .callout:nth-child(3) {
        background: #d93f78;
      }
      .callout b {
        display: block;
        font-size: 1.05rem;
        margin-top: 6px;
      }
      .callout span {
        font-size: 0.75rem;
        opacity: 0.88;
      }
      .pager {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .pager button {
        border: 1px solid var(--line);
        background: #fff;
        padding: 6px 9px;
        border-radius: 6px;
      }
      .hidden {
        display: none !important;
      }
      .loading {
        opacity: 0.45;
        pointer-events: none;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 45px;
      }
      .error {
        background: #fff0f3;
        border-color: #f3b9c8;
        color: #8e2748;
      }
      @media (max-width: 1150px) {
        .metrics {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          height: auto;
          position: relative;
          padding: 15px;
        }
        .brand {
          padding-bottom: 12px;
        }
        .nav {
          display: flex;
          overflow: auto;
        }
        .nav button {
          white-space: nowrap;
        }
        .dotbar {
          display: none;
        }
        .main {
          padding: 20px;
        }
        .grid2,
        .grid3 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 620px) {
        .main {
          padding: 13px;
        }
        .top {
          display: block;
        }
        .badge {
          display: inline-block;
          margin-top: 10px;
        }
        .metrics {
          grid-template-columns: repeat(2, 1fr);
        }
        .callouts {
          grid-template-columns: 1fr;
        }
        .field {
          flex: 1 1 135px;
        }
        .chart {
          height: 270px;
        }
      }
    </style>
    <style>
      .section-title {
        margin: 5px 0 10px;
        color: var(--blue);
        font-size: 1rem;
      }
      th.sortable {
        cursor: pointer;
        padding-right: 24px;
      }
      th.sortable:after {
        content: "↕";
        position: absolute;
        right: 8px;
        color: #8393a7;
      }
      th.sortable[aria-sort="ascending"]:after {
        content: "↑";
        color: var(--pink);
      }
      th.sortable[aria-sort="descending"]:after {
        content: "↓";
        color: var(--pink);
      }
      .readme {
        display: grid;
        gap: 15px;
      }
      .readme h3 {
        color: var(--blue);
        margin: 6px 0;
      }
      .definition {
        display: grid;
        grid-template-columns: minmax(170px, 0.6fr) 1.4fr;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }
      .definition:first-of-type {
        border-top: 0;
      }
      .formula {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        color: #38516f;
      }
    </style>
    <style>
      :root {
        --blue: #263440;
        --cyan: #78b6b7;
        --pink: #bd6b86;
        --yellow: #c8aa63;
        --mint: #7ea99a;
        --ink: #24292f;
        --muted: #6b7178;
        --bg: #f4f3f0;
        --card: #fff;
        --line: #deddd8;
        --shadow: 0 8px 24px rgba(38, 52, 64, 0.07);
      }
      .side {
        background: #202b35;
      }
      .brand span {
        color: #a7d0cf;
      }
      .nav button {
        color: #d7dde0;
      }
      .nav button:hover,
      .nav button.active {
        background: #f7f6f3;
        color: #202b35;
      }
      .badge {
        background: #edf5f4;
        color: #496f70;
        border-color: #c9dcda;
      }
      .filters,
      .card,
      .metric {
        background: #fff;
      }
      .btn {
        background: #a95f79;
      }
      .btn.secondary {
        background: #ecebe7;
        color: #263440;
      }
      .notice {
        border-color: #ded1ad;
        background: #faf7ed;
        color: #665c43;
      }
      .metric {
        box-shadow: 0 3px 12px rgba(38, 52, 64, 0.045);
      }
      th {
        background: #ecefec;
        color: #46525c;
      }
      tbody tr:hover {
        background: #f6f7f5;
      }
      .callout:nth-child(2) {
        background: #577b7d;
      }
      .callout:nth-child(3) {
        background: #946079;
      }
      .dotbar {
        opacity: 0.78;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">CURAPROX<span>B2B PERFORMANCE</span></div>
        <nav class="nav">
          <button data-view="readme" class="active">ReadMe</button
          ><button data-view="market">Market performance</button
          ><button data-view="promo">Discount performance</button
          ><button data-view="segment">Segment PFM</button
          ><button data-view="user">User PFM</button
          ><button data-view="behavior">User behavior</button>
        </nav>
        <div class="dotbar">
          <i style="background: #78b6b7"></i><i style="background: #bd6b86"></i
          ><i style="background: #c8aa63"></i
          ><i style="background: #7ea99a"></i>
        </div>
      </aside>
      <main class="main" id="main">
        <header class="top">
          <div>
            <h1 id="title">ReadMe</h1>
            <p id="subtitle">
              Metric definitions, calculation rules and current data
              limitations.
            </p>
          </div>
          <span class="badge" id="status">Ready</span>
        </header>
        <section class="filters hidden" id="filters">
          <div class="field">
            <label>Market</label
            ><select id="market">
              <option>All</option>
            </select>
          </div>
          <div class="field">
            <label>From</label><input type="date" id="from" />
          </div>
          <div class="field">
            <label>To</label><input type="date" id="to" />
          </div>
          <div class="field" id="grainField">
            <label>View by</label
            ><select id="grain">
              <option value="month">Month</option>
              <option value="week">Week</option>
              <option value="day">Day</option>
            </select>
          </div>
          <div class="field hidden" id="searchField">
            <label>User email</label
            ><input id="search" placeholder="Search email" />
          </div>
          <button class="btn" id="apply">Apply</button
          ><button class="btn secondary" id="reset">Reset</button>
        </section>
        <section id="content"></section>
      </main>
    </div>
    <style>
      :root {
        --blue: #0647ad;
        --cyan: #00a9d6;
        --pink: #e91e73;
        --yellow: #f1b928;

      }
    </style>
    <style>
      :root {
        --ink: #002849;
        --body: #595959;
        --muted: #747474;
        --line: #d6d6d6;
        --soft: #f6f8fb;
        --card: #fff;
        --blue: #003da5;
        --cyan: #00a3e0;
        --pink: #e31c79;
        --lime: #97d700;
        --purple: #702f8a;
        --green: #677f60;
        --red: #c72f51;
        --font-body: Helvetica, Arial, sans-serif;
        --font-heading: Tahoma, Arial, sans-serif;
        --shadow: 0 5px 18px #0028490b;
      }

            var(--blue) 0 42%,
            var(--cyan) 42% 62%,
            var(--lime) 62% 78%,
            var(--pink) 78%
          )
          1;
        background: var(--soft);
        color: var(--body);
        font: 400 14px/1.45 var(--font-body);
      }

        grid-template-columns: 246px minmax(0, 1fr);
      }
      .side {
        background: var(--blue);
        padding: 24px 16px;
      }

        font: 600 22px/1.12 var(--font-heading);
        letter-spacing: 0.06em;
      }
      .brand span {
        color: #fff;
        font: 700 11px/1.4 var(--font-body);
        letter-spacing: 0.16em;
        opacity: 0.82;
      }
      .nav button {
        color: #fff;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 700;
        padding: 11px 14px;

      .nav button:hover,
      .nav button.active {
        background: #fff;

      }

        font-size: 13px;
        color: var(--muted);

        font-size: 13px;

        background: #002f82;

        color: var(--blue);

        color: var(--ink);

      .metric.metric-tax {

      }
      .metric.metric-netInc {

      }
      .metric.metric-actualPaid {
        border-top-color: var(--purple);

      .metric.metric-cm1 {

      .metric.metric-repeatUsers {
        border-top-color: var(--cyan);
      }
      .metric .l {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.55px;

      }
      .metric .v {
        color: var(--ink);
        font: 500 26px/1.2 var(--font-heading);
        font-variant-numeric: tabular-nums;
        margin-top: 5px;
      }

          ].map((name, i) => ({
            name,
            gmvInc: 250000 / (i + 1),
            gmvExc: 220000 / (i + 1),
            discount: 26000 / (i + 1),
            orders: 480 / (i + 1),
            customers: 350 / (i + 1),

            discountRate: 0.08 + i * 0.02,
            discountPerOrder: 54,
            gmvPerDiscount: 8.5 - i,

          return {
            summary: {
              gmvInc: 510000,
              gmvExc: 450000,
              discount: 52000,
              orders: 900,
              customers: 700,
              aov: 500,
              discountRate: 0.116,
              discountPerOrder: 58,
              gmvPerDiscount: 8.7,
            },
            types,
            trend: periods.flatMap((period) =>
              types.map((x) => ({ ...x, period, type: x.name })),
            ),
            codes: types.flatMap((x, i) =>
              periods
                .slice(-2)
                .map((period) => ({
                  ...x,
                  period,
                  code: "PROMO" + (i + 1),
                  description: "Promotion description",
                  type: x.name,
                  objective: "Retention",
                  environment: "online",
                  channel: "Newsletter",

            ),
          };
        }
        const rows = Array.from({ length: 25 }, (_, i) => ({
          market: markets[i % 4],
          email: `buyer${i + 1}@clinic.com`,
          gmvInc: 14000 / (i + 1),
          gmvExc: 12000 / (i + 1),
          orders: 15 - (i % 10),
          aov: 450 + i * 7,
          qtyPerOrder: 20 + (i % 8),
          promoOrderRate: (i % 5) / 10,
          discountRate: 0.08,
          firstOrder: "2024-02-01",
          lastOrder: i % 3 ? "2026-09-12" : "2025-10-10",
          avgDays: 45 + i,
          gmvPerOrder: 450 + i * 7,
          promoRate: (i % 5) / 10,
          lifecycle: i % 3 ? "Repeat" : "Churn",
        }));
        if (a === "user") return { total: 17662, page: S.page, size: 25, rows };
        return {
          summary: {
            users: 17662,
            newUsers: 4100,
            repeatUsers: 8800,
            churnUsers: 4762,
            newRate: 0.232,
            repeatRate: 0.498,
            churnRate: 0.27,
            promoSensitiveUsers: 3900,
            promoSensitiveRate: 0.221,
            avgFrequencyDays: 72,
          },
          stages: [1, 2, 3, 4, 5].map((step, i) => ({
            step,
            reached: 17662 / (i + 1),
            next: 17662 / (i + 2),
            retention: (i + 1) / (i + 2),
            dropoff: 1 / (i + 2),
          })),
          asOf: "2026-09-28",
          churnDays: 180,
          total: 17662,
          page: S.page,
          size: 25,
          rows,
        };
      }
      api("bootstrap").then((b) => {
        S.boot = b;
        b.markets.forEach((m) => $("market").add(new Option(m, m)));
        updateTimeline(true);
        load();
      });
    </script>
